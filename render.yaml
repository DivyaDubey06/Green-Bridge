services:
  - type: web
    name: greenbridge-backend
    runtime: node
    plan: free
    buildCommand: npm install && npm install --prefix backend && npx prisma generate --schema=backend/prisma/schema.prisma && npm run build --prefix backend
    startCommand: npm run start:prod --prefix backend
    envVars:
      - key: PORT
        value: 5000
      - key: USE_MOCK_DATABASE
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
